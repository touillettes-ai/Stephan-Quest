<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{position:fixed;left:0;top:0}</style></head>
<body><canvas id="c" width="960" height="544"></canvas>
<script src="../js/util.js"></script><script src="../js/music.js"></script><script src="../js/draw.js"></script><script src="../js/engine.js"></script><script src="../js/content.js"></script>
<script>
// Page de test : #titre | #select | #level/NOM/xPixels | #cut/NOM/secondes  (rend UNE image puis s'arrête)
const [kind, name, param] = location.hash.slice(1).split('/');
const game = new Game(document.getElementById('c'));
let sc;
const step = (dt, keys) => { Input.pressed = keys || {}; sc.update(dt); Input.endFrame(); };
if (kind === 'title') { sc = new TitleScene(game); sc.enter(); for (let i = 0; i < 45; i++) step(1 / 30); }
else if (kind === 'select') { sc = new ChapterSelect(game); sc.enter(); sc.sel = +name || 0; step(1 / 30); }
else if (kind === 'minis') { sc = new MiniGameSelect(game); sc.enter(); sc.sel = +name || 0; for (let i = 0; i < 20; i++) step(1 / 30); }
else if (kind === 'credits') { sc = new CreditsScene(game); sc.enter(); for (let i = 0; i < 150; i++) step(1 / 30); }
else if (kind === 'level') {
  sc = new LevelScene(game, LEVELS[name], () => {}, () => {}); sc.enter(); sc.p.inv = 999;
  const px = +param || 0; if (px) { sc.p.x = px; sc.p.y = FLOOR_Y; sc.snapCam(); }
  for (let i = 0; i < 45; i++) step(1 / 30, i === 30 ? { Space: true } : {});
  Input.down = {}; sc.p.inv = 0; if (px) sc.t = 6;
}
else if (kind === 'bunny') {
  sc = new BunnyScene(game, ARENAS[name], () => {}, () => {}); sc.enter();
  const T = +param || 8; for (let i = 0; i < T * 30; i++) { const keys = {}; if (sc.phase === 'aim' && Math.abs(sc.theta - 0.8) < 0.06) keys.Space = true; else if (sc.phase === 'fall' && !sc.swung) { const B = sc.sweet(); if (Math.hypot(sc.m.x - B.x, sc.m.y - B.y) < 40) keys.Space = true; } step(1 / 30, keys); }
}
else if (kind === 'pong') {
  sc = new PongScene(game, ARENAS[name], () => {}, () => {}); sc.enter();
  const T = +param || 8; for (let i = 0; i < T * 30; i++) { const b = sc.ball, k = {}; if (b.y < sc.py - 8) k.ArrowUp = true; else if (b.y > sc.py + 8) k.ArrowDown = true; Input.down = k; step(1 / 30, {}); } Input.down = {};
}
else if (kind === 'pac') {
  sc = new PacScene(game, ARENAS[name], () => {}, () => {}); sc.enter();
  const T = +param || 6; const seq = [{ ArrowLeft: true }, { ArrowUp: true }, { ArrowRight: true }, { ArrowDown: true }]; for (let i = 0; i < T * 30; i++) { Input.down = seq[Math.floor(i / 45) % 4]; step(1 / 30, {}); } Input.down = {};
}
else if (kind === 'invader') {
  sc = new InvaderScene(game, ARENAS[name], () => {}, () => {}); sc.enter();
  const T = +param || 8; for (let i = 0; i < T * 30; i++) { const al = sc.alive(), k = {}; if (al.length) { const e = al.reduce((a, b) => Math.abs(sc.ex(b) - sc.px) < Math.abs(sc.ex(a) - sc.px) ? b : a); if (e && sc.ex(e) < sc.px - 6) k.ArrowLeft = true; else if (e && sc.ex(e) > sc.px + 6) k.ArrowRight = true; k.Space = true; } Input.down = k; step(1 / 30, {}); } Input.down = {};
}
else if (kind === 'aura') {
  sc = new AuraScene(game, ARENAS[name], () => {}, () => {}); sc.enter();
  const T = +param || 12; for (let i = 0; i < T * 30; i++) { const keys = {}; if (sc.phase === 'turn' && (sc.turn === 0 || !sc.cpu)) for (const a of sc.arrows) if (a.state === 0 && Math.abs(a.t - sc.songTime()) < 1 / 60) keys[['ArrowLeft', 'ArrowDown', 'ArrowUp', 'ArrowRight'][a.lane]] = true; step(1 / 30, keys); }
}
else if (kind === 'dance') {
  sc = new DanceScene(game, ARENAS[name], () => {}, () => {}); sc.enter();
  const T = +param || 8; for (let i = 0; i < T * 30; i++) step(1 / 30, {});
}
else if (kind === 'broom') {
  sc = new BroomScene(game, ARENAS[name], () => {}, () => {}); sc.enter();
  const T = +param || 5; for (let i = 0; i < T * 30; i++) step(1 / 30, i % 12 === 0 ? { Enter: true } : {});
}
else if (kind === 'cut') {
  sc = new CutScene(game, CUTS[name], () => {}); sc.enter();
  const T = +param || 3;
  for (let i = 0; i < T * 30; i++) step(1 / 30, (i % 14 === 0 && i > 0 && sc.dlg && sc.dlg.shown >= sc.dlg.text.length) ? { Enter: true } : {});
}
game.scene = sc; game.draw();
</script></body></html>
